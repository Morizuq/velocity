<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Velocity - Financial Trajectory & Wealth Dashboard">
  <meta name="theme-color" content="#0B101B">

  <!-- Preconnect to Google gstatic CDN for rapid CanvasKit & Font acquisition -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">

  <!-- Preload core bootstrap entrypoint -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Velocity">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon: Modern SVG with PNG Fallback -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <title>Velocity | Financial Trajectory</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Eradicate white flash: match Flutter dark canvas background immediately */
    html, body {
      background-color: #0B101B;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      background-color: #0B101B;
      color: #E2E8F0;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 99999;
      pointer-events: none;
      transition: opacity 0.35s ease-out;
    }

    .loading-logo {
      width: 60px;
      height: 60px;
      animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.06);
        opacity: 1;
      }
    }
  </style>

  <script>
    // Evict any legacy PWA service workers to match React instant refresh behavior
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }

    // Dismissal fallback: ensures splash screen disappears as soon as first frame paints
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 350);
      }
    });
  </script>
</head>
<body>
  <div id="loading-container">
    <img src="favicon.svg" alt="Velocity Logo" class="loading-logo" />
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
